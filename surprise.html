<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Surprise 💚</title>

    <link rel="stylesheet" href="style.css">
<style>
.surprise-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.surprise-card {
    width: 100%;
    max-width: 600px;
    padding: 45px 25px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(0,255,136,.25);
    box-shadow: 0 0 30px rgba(0,255,136,.12);
}

/* Gift screen */
#giftScreen {
    min-height: 55vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.surprise-gift {
    font-size: 120px;
    margin-bottom: 18px;
    cursor: pointer;
    user-select: none;
    animation: giftFloat 2.5s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(0,255,136,.5));
    transition: transform .7s ease, opacity .7s ease;
}

@keyframes giftFloat {
    0%, 100% {
        transform: translateY(0) rotate(-2deg);
    }

    50% {
        transform: translateY(-15px) rotate(2deg);
    }
}

#giftScreen p {
    margin: 0;
    font-size: 16px;
    letter-spacing: 1px;
    opacity: .75;
    animation: textPulse 2s ease-in-out infinite;
}

@keyframes textPulse {
    0%, 100% {
        opacity: .5;
    }

    50% {
        opacity: 1;
    }
}

/* Message */
#surpriseTitle {
    font-size: 32px;
    margin-bottom: 15px;
    background: linear-gradient(90deg, #00ff88, #00d9ff, #9d5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

#recipientName {
    color: #00ff88;
    margin-bottom: 15px;
}

#surpriseDate {
    color: #ccc;
    margin-bottom: 25px;
}

#surpriseMessage {
    white-space: pre-line;
    line-height: 1.9;
    font-size: 18px;
    text-align: left;
}

.from {
    margin-top: 30px;
    color: #00ff88;
}

.loading {
    text-align: center;
    padding: 40px 20px;
}

.error {
    color: #ff6b6b;
}

/* Background */
body {
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(0,255,136,.12),
            transparent 35%
        ),
        #030303;
}
#themeParticles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.surprise-page {
    position: relative;
    z-index: 1;
}
}

.particle {
    position: absolute;
    font-size: 22px;
    opacity: .55;
    animation: floatDown 12s linear infinite;
    filter: drop-shadow(0 0 8px currentColor);
}
@keyframes floatDown {
    from {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: .6;
    }

    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

    /* Mobile optimization */
@media (max-width: 600px) {

    .surprise-card {
        padding: 35px 20px;
        border-radius: 25px;
    }

    .surprise-gift {
        font-size: 100px;
    }

    #surpriseTitle {
        font-size: 27px;
    }

    #surpriseMessage {
        font-size: 17px;
    }
}
 /* Smooth message entrance */
#messageScreen {
    animation: messageAppear 1.2s ease forwards;
}

@keyframes messageAppear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
/* Smooth recipient name */
#recipientName {
    opacity: 0;
    animation: recipientAppear 1s ease 1.2s forwards;
}

@keyframes recipientAppear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
    }
/* Smooth date entrance */
#surpriseDate {
    opacity: 0;
    animation: dateAppear 1s ease 1.5s forwards;
}

@keyframes dateAppear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
        }
</style>
        
</head>

<body>

<div id="themeParticles"></div>

<div class="surprise-page">

    <div class="surprise-card" id="surpriseCard">

        <div class="loading" id="loading">
            🎁
            <p>Opening your surprise...</p>
        </div>

        <div id="surpriseContent" style="display:none;">
    
    <div id="giftScreen">

    <div class="surprise-gift" id="giftBox">
        🎁
    </div>

    <p>Tap the gift to open your surprise ✨</p>

    </div>

    <div id="messageScreen" style="display:none;">

            

            <h1 id="surpriseTitle">
                A Special Surprise 💚
            </h1>

            <h2 id="recipientName">
                Someone Special
            </h2>

            <p id="surpriseDate"></p>

            <div id="surpriseMessage"></div>

            <p class="from">
                With love from <span id="senderName"></span> 💚
            </p>
</div>
        </div>
        </div>

        <div id="errorMessage" style="display:none;">
            <h2 class="error">
                😔 Surprise not found
            </h2>

            <p>
                This surprise link may be invalid or expired.
            </p>
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ghlomcrgxkvequombpni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_WNWXz8z0_sOyiQRvkKiQPQ_XYIMo0Mq";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadSurprise() {

    const params =
        new URLSearchParams(window.location.search);

    const slug =
        params.get("surprise");

    if (!slug) {

        showError();

        return;
    }


    const { data, error } =
        await supabaseClient
            .from("surprises")
            .select("*")
            .eq("slug", slug)
            .single();


    if (error || !data) {

        console.error(error);

        showError();

        return;
    }


    document.getElementById("loading").style.display =
        "none";

    document.getElementById("surpriseContent").style.display =
        "block";


    document.getElementById("recipientName").textContent =
        data.recipient_name || "Someone Special";


    document.getElementById("senderName").textContent =
        data.sender_name || "Someone";


    const messageElement =
    document.getElementById("surpriseMessage");

const messageText =
    data.message || "A special message for you 💚";

messageElement.textContent = "";

let messageIndex = 0;

function typeSurpriseMessage() {

    if (messageIndex < messageText.length) {

        messageElement.textContent +=
            messageText.charAt(messageIndex);

        messageIndex++;

        setTimeout(typeSurpriseMessage, 55);

    }
}

setTimeout(() => {
    typeSurpriseMessage();
}, 800);
    
    if (data.special_date) {

        const date =
            new Date(data.special_date);

        document.getElementById("surpriseDate").textContent =
            date.toLocaleDateString("en-GB", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });

    }


    if (data.occasion === "Birthday") {

        document.getElementById("surpriseTitle").textContent =
            "Happy Birthday 🎂";

    } else if (data.occasion === "Anniversary") {

        document.getElementById("surpriseTitle").textContent =
            "Happy Anniversary ❤️";

    } else if (data.occasion === "Love") {

        document.getElementById("surpriseTitle").textContent =
            "A Special Surprise For You 💚";

    } else if (data.occasion === "Friendship") {

        document.getElementById("surpriseTitle").textContent =
            "For A Special Friend 🤝";

    }

/* ===== Apply Selected Theme ===== */

const pageBody = document.body;
const card = document.getElementById("surpriseCard");
const title = document.getElementById("surpriseTitle");
const recipient = document.getElementById("recipientName");
const from = document.querySelector(".from");
const gift = document.getElementById("giftBox");
const particles =
    document.getElementById("themeParticles");

function createParticles(icon) {

    particles.innerHTML = "";

    for (let i = 0; i < 20; i++) {

        const p =
            document.createElement("span");

        p.className = "particle";

        p.textContent = icon;

        p.style.left =
            Math.random() * 100 + "%";

        p.style.animationDelay =
            Math.random() * 12 + "s";

        p.style.animationDuration =
            (8 + Math.random() * 6) + "s";

        particles.appendChild(p);
    }
    }
  
    if (data.theme === "blue") {

    pageBody.style.background =
        "radial-gradient(circle at 50% 20%, rgba(0,150,255,.20), transparent 35%), #020817";

    card.style.borderColor =
        "rgba(0,150,255,.35)";

    card.style.boxShadow =
        "0 0 30px rgba(0,150,255,.18)";

    recipient.style.color = "#42a5f5";
    from.style.color = "#42a5f5";

    title.style.backgroundImage =
    "linear-gradient(90deg, #42a5f5, #00d9ff, #90caf9)";
gift.style.filter =
    "drop-shadow(0 0 18px #42a5f5) drop-shadow(0 0 40px #00d9ff)";
  createParticles("❄️");
    }
        
        
else if (data.theme === "pink") {

    pageBody.style.background =
        "radial-gradient(circle at 50% 20%, rgba(255,20,147,.20), transparent 35%), #16030d";

    card.style.borderColor =
        "rgba(255,70,150,.35)";

    card.style.boxShadow =
        "0 0 30px rgba(255,70,150,.18)";

    recipient.style.color = "#ff5fa2";
    from.style.color = "#ff5fa2";

    title.style.backgroundImage =
    "linear-gradient(90deg, #ff5fa2, #ff8acb, #ff4081)";
gift.style.filter =
    "drop-shadow(0 0 18px #ff5fa2) drop-shadow(0 0 40px #ff4081)";
createParticles("💗");
}

else if (data.theme === "purple") {

    pageBody.style.background =
        "radial-gradient(circle at 50% 20%, rgba(160,60,255,.20), transparent 35%), #0d0316";

    card.style.borderColor =
        "rgba(180,80,255,.35)";

    card.style.boxShadow =
        "0 0 30px rgba(180,80,255,.18)";

    recipient.style.color = "#c084fc";
    from.style.color = "#c084fc";

    title.style.backgroundImage =
    "linear-gradient(90deg, #c084fc, #a855f7, #e879f9)";
gift.style.filter =
    "drop-shadow(0 0 18px #c084fc) drop-shadow(0 0 40px #a855f7)";
createParticles("✨");
}

else {

    /* Green theme */

    pageBody.style.background =
        "radial-gradient(circle at 50% 20%, rgba(0,255,136,.15), transparent 35%), #030303";

    card.style.borderColor =
        "rgba(0,255,136,.35)";

    card.style.boxShadow =
        "0 0 30px rgba(0,255,136,.15)";

    recipient.style.color = "#00ff88";
    from.style.color = "#00ff88";

    title.style.backgroundImage =
    "linear-gradient(90deg, #00ff88, #00d9ff, #9d5cff)";
   gift.style.filter =
    "drop-shadow(0 0 18px #00ff88) drop-shadow(0 0 40px #00d9ff)";
createParticles("💚");
}
    }
    
function showError() {

    document.getElementById("loading").style.display =
        "none";

    document.getElementById("errorMessage").style.display =
        "block";
}


loadSurprise();

</script>
<script>
const giftBox = document.getElementById("giftBox");
const giftScreen = document.getElementById("giftScreen");
const messageScreen = document.getElementById("messageScreen");

giftBox.addEventListener("click", () => {

    giftBox.style.transform = "scale(1.5) rotate(15deg)";
    giftBox.style.opacity = "0";

    setTimeout(() => {

        giftScreen.style.display = "none";
        messageScreen.style.display = "block";

    }, 700);

});
</script>
<footer class="developer-credit">
    DEVELOPED BY FAHIM
</footer>
</body>
  </html>
